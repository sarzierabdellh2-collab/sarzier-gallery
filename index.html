<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض عبد الله سارزير الفني</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f4ed;
            color: #2c2c2c;
            font-family: 'Amiri', 'Traditional Arabic', serif, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #2c2c2c;
            color: #f7f4ed;
            border: 2px solid #d4af37;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #d4af37;
            color: #1a1a1a;
        }
        .gallery-container {
            position: relative;
            max-width: 90vw;
            max-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .artwork-frame {
            max-width: 100%;
            max-height: 65vh;
            border: 8px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 4px;
            object-fit: contain;
        }
        .counter {
            margin-top: 15px;
            font-size: 1rem;
            color: #d4af37;
            font-weight: bold;
        }
        .nav-hint {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- الشاشة الترحيبية -->
    <div id="welcome-screen" class="screen active">
        <h1>عبد الله سارزير</h1>
        <p>معرض اللوحات الفنية الأصلية (زيت وريش وأكريليك)</p>
        <button class="btn" onclick="startGallery()">دخول المعرض</button>
    </div>

    <!-- شاشة المعرض -->
    <div id="gallery-screen" class="screen">
        <div class="gallery-container" id="swipe-area">
            <img id="artwork" class="artwork-frame" src="" alt="لوحة فنية">
        </div>
        <div class="counter" id="counter">1 / 9</div>
        <div class="nav-hint">اسحب يميناً أو يساراً للتنقل بين اللوحات</div>
    </div>

    <script>
        const images = [
            "images/1.jpg",
            "images/2.jpg",
            "images/3.jpg",
            "images/4.jpg",
            "images/5.jpg",
            "images/6.jpg",
            "images/7.jpg",

        ];

        let currentIndex = 0;
        const welcomeScreen = document.getElementById('welcome-screen');
        const galleryScreen = document.getElementById('gallery-screen');
        const artworkImg = document.getElementById('artwork');
        const counterDiv = document.getElementById('counter');
        const swipeArea = document.getElementById('swipe-area');

        function startGallery() {
            welcomeScreen.classList.remove('active');
            galleryScreen.classList.add('active');
            updateArtwork();
        }

        function updateArtwork() {
            artworkImg.src = images[currentIndex];
            counterDiv.textContent = (currentIndex + 1) + " / " + images.length;
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            updateArtwork();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateArtwork();
        }

        // دعم السحب باللمس للهواتف
        let touchStartX = 0;
        let touchEndX = 0;

        swipeArea.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        swipeArea.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                nextImage(); // سحب لليسار -> الصورة التالية
            }
            if (touchEndX > touchStartX + 50) {
                prevImage(); // سحب لليمن -> الصورة السابقة
            }
        }

        // دعم لوحة المفاتيح
        document.addEventListener('keydown', e => {
            if (galleryScreen.classList.contains('active')) {
                if (e.key === 'ArrowRight') prevImage();
                if (e.key === 'ArrowLeft') nextImage();
            }
        });
    </script>
</body>
</html>
