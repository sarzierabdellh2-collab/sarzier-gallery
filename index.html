<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f4ed">
<title>SARZIER — Galerie d'art</title>
<style>
:root {
  --bg: #f7f4ed;
  --panel: #ffffff;
  --text: #2c2c2c;
  --gold: #9c7c47;
  --muted: #66635d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
}
button { font: inherit; cursor: pointer; }
.screen { display: none; }
.screen.active { display: block; }
.welcome {
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 20px;
}
.eyebrow {
  color: var(--gold);
  font: 11px Arial, sans-serif;
  letter-spacing: 4px;
  text-transform: uppercase;
}
.welcome h1 {
  font-size: clamp(45px, 12vw, 85px);
  font-weight: normal;
  letter-spacing: 8px;
  margin: 20px 0 10px;
}
.primary {
  margin-top: 25px;
  padding: 14px 24px;
  border: 1px solid var(--gold);
  color: var(--text);
  background: transparent;
  letter-spacing: 2px;
  font: 11px Arial, sans-serif;
  transition: .2s;
}
.primary:hover { background: var(--gold); color: #fff; }
.gallery { padding: 25px 5% 50px; }
.gallery-head { text-align: center; margin-bottom: 20px; }
.gallery-head h2 { font-weight: normal; font-size: 24px; margin: 8px 0; }
.artwork {
  max-width: 550px;
  margin: auto;
  text-align: center;
}
.art-frame {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 4 / 5;
  background: var(--panel);
  border: 1px solid #dcd5c7;
  padding: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}
.art-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.art-info { padding: 15px 5px 10px; }
.art-info h3 { font-size: 22px; font-weight: normal; margin: 0 0 6px; }
.art-info p { color: var(--muted); font-size: 13px; margin: 4px 0; }
.counter {
  color: var(--gold);
  font: 11px Arial, sans-serif;
  letter-spacing: 2px;
  margin: 10px 0;
}
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 5px;
}
.arrow {
  width: 48px;
  height: 48px;
  border: 1px solid var(--gold);
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  font-size: 20px;
}
.arrow:hover { background: var(--gold); color: #fff; }
.back {
  display: block;
  margin: 25px auto 0;
  border: 0;
  background: none;
  color: var(--muted);
  font: 11px Arial, sans-serif;
  letter-spacing: 2px;
}
footer {
  padding: 20px;
  text-align: center;
  color: var(--muted);
  font: 10px Arial, sans-serif;
}
</style>
</head>
<body>

<main>
<section class="screen active" id="home">
  <div class="welcome">
    <div class="eyebrow">ARTISTE PEINTRE</div>
    <h1>SARZIER</h1>
    <p style="color: var(--muted); font-style: italic;">L'art, une fenêtre sur l'émotion.</p>
    <button class="primary" id="enter">DÉCOUVRIR LA GALERIE ↗</button>
  </div>
</section>

<section class="screen" id="gallery">
  <div class="gallery">
    <div class="gallery-head">
      <div class="eyebrow">COLLECTION</div>
      <h2>Mes Œuvres</h2>
    </div>

    <div class="artwork">
      <div class="art-frame" id="frame">
        <img id="artImage" alt="">
      </div>

      <div class="art-info">
        <h3 id="artTitle"></h3>
        <p id="artMedium"></p>
        <p id="artSize"></p>
      </div>
